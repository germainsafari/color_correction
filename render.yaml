# Render Blueprint: ensures correct start command and health check for Streamlit.
# This helps avoid 502s when the app takes time to start or when health checks fail.
services:
  - type: web
    name: color-correction
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    healthCheckPath: /_stcore/health
